<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI Translator 设置</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 520px;
        margin: 24px auto;
        padding: 0 16px;
        color: #1a1a1a;
      }
      label {
        display: block;
        margin-top: 14px;
        font-size: 13px;
        font-weight: 600;
      }
      input,
      select {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .row label {
        flex: 1;
      }
      button {
        margin-top: 20px;
        padding: 8px 16px;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        color: #0a7;
      }
      .hint {
        font-size: 12px;
        color: #666;
        font-weight: 400;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>AI Translator 设置</h1>

    <label>
      默认 Provider
      <select id="provider">
        <option value="deepseek">DeepSeek（扩展直连）</option>
        <option value="cursor">Cursor（需桌面端）</option>
      </select>
    </label>

    <label>
      DeepSeek Base URL
      <input id="baseUrl" type="url" placeholder="https://api.deepseek.com" />
    </label>
    <label>
      DeepSeek API Key
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-…" />
    </label>
    <label>
      DeepSeek 模型
      <input id="model" type="text" placeholder="deepseek-v4-flash" />
    </label>

    <label>
      整页翻译模式
      <select id="pageMode">
        <option value="bilingual">双语对照（默认）</option>
        <option value="replace">替换原文</option>
      </select>
      <div class="hint">双语更安全；替换可一键还原。</div>
    </label>

    <label style="margin-top: 20px">
      桌面状态（Cursor）
      <p id="desktop-status" class="hint" style="margin-top: 6px; font-weight: 400">检测中…</p>
    </label>

    <button id="save" type="button">保存</button>
    <p id="status"></p>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
