<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI Translator</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 12px;
        min-width: 240px;
      }
      button {
        width: 100%;
        margin: 4px 0;
        padding: 8px;
      }
      .mode-label {
        font-size: 12px;
        color: #666;
        margin: 0 0 4px;
      }
      .mode-toggle {
        display: flex;
        gap: 0;
        margin: 0 0 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        overflow: hidden;
      }
      .mode-toggle button {
        width: 50%;
        margin: 0;
        padding: 6px 4px;
        border: none;
        border-radius: 0;
        background: #f5f5f5;
        font-size: 12px;
        cursor: pointer;
      }
      .mode-toggle button + button {
        border-left: 1px solid #ccc;
      }
      .mode-toggle button[aria-pressed='true'] {
        background: #1a1a1a;
        color: #fff;
      }
      #status {
        font-size: 12px;
        color: #666;
        margin-top: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1 style="font-size: 14px; margin: 0 0 8px">AI Translator</h1>
    <p class="mode-label">整页模式</p>
    <div class="mode-toggle" role="group" aria-label="整页翻译模式">
      <button id="mode-bilingual" type="button" aria-pressed="true">双语对照</button>
      <button id="mode-replace" type="button" aria-pressed="false">替换原文</button>
    </div>
    <button id="translate-page" type="button">翻译此页</button>
    <button id="clear-page" type="button">清除 / 还原</button>
    <button id="open-options" type="button">打开设置</button>
    <p id="status"></p>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
