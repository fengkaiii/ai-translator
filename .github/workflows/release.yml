name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          # windows-latest → VS2026；当前 node-gyp / @electron/rebuild 认不出，先钉在 2022
          - os: windows-2022
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # node-gyp (uiohook-napi) needs distutils; Python 3.12+ removed it
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools for node-gyp
        run: python -m pip install setuptools

      - name: Install Linux native build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxrandr-dev \
            libxtst-dev \
            libxt-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxkbfile-dev \
            libx11-xcb-dev \
            libxcb1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish desktop
        run: npm run build -w ai-translator-desktop && npx --workspace=ai-translator-desktop electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_python: python

  # 与桌面解耦：桌面失败时仍可上传扩展 zip
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension zip
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          npm run build:extension
          test -f apps/extension/dist/manifest.json
          VER="${GITHUB_REF_NAME#v}"
          OUT="release/ai-translator-extension-${VER}.zip"
          mkdir -p release
          rm -f "$OUT"
          (cd apps/extension/dist && zip -r -q "../../../${OUT}" .)
          ls -la "$OUT"
          echo "EXTENSION_ZIP=${OUT}" >> "$GITHUB_ENV"

      - name: Upload extension to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 桌面包可能尚未创建 Release：没有则先建空 Release
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Release ${GITHUB_REF_NAME}" \
              --latest=false
          fi
          gh release upload "$GITHUB_REF_NAME" "$EXTENSION_ZIP" --clobber
