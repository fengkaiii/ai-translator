name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 交叉编译 arm64+x64；若原生依赖失败，回退为：
          # - macos-latest + --mac --arm64
          # - macos-13 + --mac --x64
          - os: macos-latest
            args: --mac --x64 --arm64
          # windows-latest → VS2026；当前 node-gyp / @electron/rebuild 认不出，先钉在 2022
          - os: windows-2022
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # node-gyp (uiohook-napi) needs distutils; Python 3.12+ removed it
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools for node-gyp
        run: python -m pip install setuptools

      - name: Install Linux native build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxrandr-dev \
            libxtst-dev \
            libxt-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxkbfile-dev \
            libx11-xcb-dev \
            libxcb1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # arm64 runner 默认拒装 x64 optional（EBADPLATFORM）；--force 才能交叉拉取
      - name: Ensure Cursor SDK darwin-x64 optional
        if: runner.os == 'macOS'
        run: |
          npm install --no-save --no-package-lock --force @cursor/sdk-darwin-x64@1.0.24
          test -d node_modules/@cursor/sdk-darwin-x64

      - name: Ensure app-builder binaries executable
        shell: bash
        run: |
          find node_modules/app-builder-bin -type f \( -name 'app-builder' -o -name 'app-builder_*' -o -name 'app-builder.exe' \) -exec chmod +x {} \;
          ls -la node_modules/app-builder-bin/*/ 2>/dev/null | head -40

      # workspace 软链指向 packages/，asar 要求文件位于 app 目录内
      - name: Materialize translate-core into desktop node_modules
        shell: bash
        run: |
          set -euo pipefail
          DEST="apps/desktop/node_modules/@ai-translator/translate-core"
          mkdir -p "$(dirname "$DEST")"
          rm -rf "$DEST"
          cp -a packages/translate-core "$DEST"
          # 避免仍解析到仓库根上的软链
          if [ -e node_modules/@ai-translator/translate-core ]; then
            rm -rf node_modules/@ai-translator/translate-core
            mkdir -p node_modules/@ai-translator
            cp -a packages/translate-core node_modules/@ai-translator/translate-core
          fi
          test -f "$DEST/package.json"
          test ! -L "$DEST"

      # 不走 electron-builder publish：避免上传 .blockmap / latest*.yml（自动更新元数据，本项目未使用）
      - name: Build desktop
        run: npm run build -w ai-translator-desktop && npx --workspace=ai-translator-desktop electron-builder ${{ matrix.args }} --publish never
        env:
          npm_config_python: python

      - name: Upload installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Release ${GITHUB_REF_NAME}" \
              --latest=false
          fi
          shopt -s nullglob
          files=(release/*.dmg release/*.exe release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer artifacts found in release/"
            ls -la release/ || true
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  # 与桌面解耦：桌面失败时仍可上传扩展 zip
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension zip
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          npm run build:extension
          test -f apps/extension/dist/manifest.json
          VER="${GITHUB_REF_NAME#v}"
          OUT="release/ai-translator-extension-${VER}.zip"
          mkdir -p release
          rm -f "$OUT"
          (cd apps/extension/dist && zip -r -q "../../../${OUT}" .)
          ls -la "$OUT"
          echo "EXTENSION_ZIP=${OUT}" >> "$GITHUB_ENV"

      - name: Upload extension to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 桌面包可能尚未创建 Release：没有则先建空 Release
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Release ${GITHUB_REF_NAME}" \
              --latest=false
          fi
          gh release upload "$GITHUB_REF_NAME" "$EXTENSION_ZIP" --clobber
