name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          # windows-latest → VS2026；当前 node-gyp / @electron/rebuild 认不出，先钉在 2022
          - os: windows-2022
            args: --win
          - os: ubuntu-latest
            args: --linux
            # 仅 Linux 跑扩展 zip，避免三端各传一份
            pack_extension: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # node-gyp (uiohook-napi) needs distutils; Python 3.12+ removed it
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools for node-gyp
        run: python -m pip install setuptools

      - name: Install Linux native build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxrandr-dev \
            libxtst-dev \
            libxt-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxkbfile-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            zip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish desktop
        run: npm run build -w ai-translator-desktop && npx --workspace=ai-translator-desktop electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_python: python

      # 浏览器扩展：打 zip 并挂到同一次 GitHub Release（仅 Ubuntu）
      - name: Build and upload browser extension
        if: matrix.pack_extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm run build:extension
          test -f apps/extension/dist/manifest.json
          VER="${GITHUB_REF_NAME#v}"
          OUT="release/ai-translator-extension-${VER}.zip"
          mkdir -p release
          rm -f "$OUT"
          # zip 根目录即扩展内容，解压后可直接 Load unpacked
          (cd apps/extension/dist && zip -r -q "../../../${OUT}" .)
          ls -la "$OUT"
          # 桌面包已由 electron-builder 创建 Release；再追加扩展资产
          gh release upload "$GITHUB_REF_NAME" "$OUT" --clobber
